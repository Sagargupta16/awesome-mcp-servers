name: Submission check

# Looks up every entry a pull request adds and reports what a maintainer would
# otherwise verify by hand: stars, licence, last push, archived state, repo age,
# and whether the repository holds a real MCP implementation.
#
# Runs on `pull_request` (not `pull_request_target`) so a fork's code never
# executes with a writable token. The report goes to the job summary and the
# check fails on a blocking problem.
#
# `labeled` and `unlabeled` are in the trigger list because the check honours the
# maintainer-override label. Without them the job never re-runs after a label is
# applied, so the documented escape hatch would only take effect on the next
# push, which is not an escape hatch at all.

# There is deliberately no `paths` filter. A required status check that is
# path-filtered never reports on a pull request that misses the filter, and
# auto-merge then waits on it forever. The job costs a few seconds when
# README.md is untouched: check_submission.py finds no new entries and exits 0.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: Check submitted entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Inspect added entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          python scripts/check_submission.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --labels "$LABELS"
