name: Auto merge

# Turns on GitHub's native auto-merge for pull requests that only add or correct
# list content, so a community entry lands as soon as the checks go green with
# nobody having to press a button. GitHub does the waiting: the merge fires when
# every required status check on `main` passes, and never before.
#
# Why an allowlist rather than "auto-merge everything". On a `pull_request` event
# the workflow definition comes from the pull request itself, so a fork can edit
# the very checks that judge it. Auto-merging such a change with no human in the
# loop would hand the repository to whoever opened it. So a pull request is only
# eligible when every file it touches is list content. Anything reaching
# `.github/`, `scripts/`, `tests/`, or the tooling config is left for a person.
#
# This runs on `pull_request_target`, which means the workflow definition comes
# from `main` and cannot be altered by a fork. It reads the changed-file list
# over the API and never checks out pull request code, so the writable token is
# never exposed to anything a contributor controls.
#
# A pull request whose entries the submission check leaves to a maintainer --
# every `Remote` entry, an unclassifiable licence, a link that is not a GitHub
# repository -- is labelled `needs-review` and left for a person to merge,
# unless its author has starred the repository (scripts/star_check.py). To
# decide that, the job checks out `main`, fetches the pull request's commits as
# data, and runs main's copy of check_submission.py over the README those
# commits carry. Nothing from the pull request is checked out or executed.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Enable auto merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      # `main`, not the pull request: on pull_request_target the default ref is
      # the base branch. Full history so the merge base with the head is there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Decide eligibility and enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # optional: lets star_check.py read the stargazer list directly
          STARGAZERS_TOKEN: ${{ secrets.STARGAZERS_TOKEN }}
        run: |
          set -euo pipefail

          # Files a pull request may touch and still merge unattended. Content
          # only: nothing here can change what the checks do.
          is_allowed() {
            case "$1" in
              README.md|CHANGELOG.md) return 0 ;;
              *) return 1 ;;
            esac
          }

          blocked=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! is_allowed "$f"; then
              blocked="$blocked$f"$'\n'
            fi
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')

          {
            echo "## Auto merge"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$blocked" ]; then
            {
              echo "Not enabled. This pull request changes files outside the list itself:"
              echo
              echo '```'
              printf '%s' "$blocked"
              echo '```'
              echo
              echo "Changes to workflows, scripts, tests or tooling config are reviewed"
              echo "by a maintainer, because they can alter what the checks verify."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case ",$LABELS," in
            *,no-auto-merge,*)
              echo "Not enabled: the \`no-auto-merge\` label is set." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *,maintainer-override,*)
              {
                echo "Not enabled: the \`maintainer-override\` label is set."
                echo
                echo "That label bypasses the submission gate, which is a maintainer's"
                echo "judgement call. Whoever applied it can merge by hand."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac

          # Compare against the merge base, not main's tip: rows main removed
          # since the branch was cut would otherwise read as new submissions.
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/head"
          base=$(git merge-base HEAD refs/remotes/pull/head)
          # Anything but a clean 0 waits for a person, a crash included, unless
          # the author has starred: a star skips the maintainer review, never a
          # failing check, which still blocks the merge on its own.
          if ! python scripts/check_submission.py --base-ref "$base" \
              --head-ref refs/remotes/pull/head --review > /dev/null; then
            if python scripts/star_check.py --starred "$AUTHOR"; then
              case ",$LABELS," in
                *,needs-review,*) gh api -X DELETE "repos/$REPO/issues/$PR/labels/needs-review" > /dev/null ;;
              esac
              {
                echo
                echo "The submission check leaves an entry to a maintainer, but @$AUTHOR"
                echo "has starred the repository, so it merges once the checks pass."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-review" > /dev/null
              {
                echo
                echo "Not enabled: the submission check leaves an entry to a maintainer."
                echo "The report above says which and why. The pull request is labelled"
                echo "\`needs-review\`, and a maintainer merges it by hand after reading it,"
                echo "unless @$AUTHOR stars the repository first."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          gh pr merge "$PR" --repo "$REPO" --auto --squash

          {
            echo "Enabled. This pull request only touches list content, so GitHub will"
            echo "squash-merge it as soon as every required check passes. No approval"
            echo "is needed, and it will not merge while any required check is red."
            echo
            echo "To stop it, add the \`no-auto-merge\` label."
          } >> "$GITHUB_STEP_SUMMARY"
