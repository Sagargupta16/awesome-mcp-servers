name: Issue to pull request

# Turns a "Suggest a server" form into the pull request a contributor would have
# opened, so a submission without git merges itself on the same checks.
#
# Three GitHub rules shape this workflow:
#
# 1. A pull request opened with GITHUB_TOKEN starts no `pull_request` workflow run,
#    so lint.yml and submission-check.yml would never report and auto-merge would
#    wait forever. This workflow dispatches both on the submission branch instead:
#    their check runs land on the branch head commit, which is the pull request's
#    head, so the required checks are satisfied by name. GitGuardian is an app, not
#    a workflow, and runs on its own.
# 2. For the same reason auto-merge.yml never sees these pull requests, so this
#    workflow switches auto-merge on itself, under the same rule: an entry the
#    submission check leaves to a maintainer (every `Remote` one, for a start)
#    gets the `needs-review` label instead and waits for a person.
# 3. The issue body is untrusted. It is read from the event payload file by
#    scripts/issue_to_pr.py and never interpolated into a command; the only value
#    that comes back (the entry name) is passed through the environment.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests". There are no required reviews, so only the "create" half is used.
# Not `labeled`: a form issue arrives with its label, which fires `opened` and
# `labeled` together and ran this twice (two identical comments on #117). To retry
# an older issue, edit it.
#
# The hourly run closes the issue once its pull request has merged. "Closes #N"
# does not fire here: GitHub skips closing keywords when the merge is made by
# auto-merge on GITHUB_TOKEN (#119 stayed open after #120 merged).
on:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "47 * * * *" # hourly
  workflow_dispatch:

# nothing by default; each job asks for exactly what it writes
permissions: {}

concurrency:
  group: issue-to-pr-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  close-merged:
    name: Close issues whose submission merged
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # The thank-you text, badge and star ask come from scripts/thank_contributors.py,
      # the same source thanks.yml uses for contributor pull requests.
      - name: Close each open form issue with a merged pull request
        run: |
          for n in $(gh issue list -R "$REPO" --label addition --state open --limit 200 --json number --jq '.[].number'); do
            pr=$(gh pr list -R "$REPO" --head "submission/issue-$n" --state merged --json number --jq '.[0].number')
            if [ -n "$pr" ]; then
              if python scripts/thank_contributors.py --issue "$n" --pr "$pr" > thanks.md; then
                gh issue comment "$n" -R "$REPO" --body-file thanks.md
              else
                gh issue comment "$n" -R "$REPO" --body "Merged in #$pr, so it is on the list and at https://sagargupta.online/awesome-mcp-servers/ now. Thanks!"
              fi
              gh issue close "$n" -R "$REPO" --reason completed
              echo "closed #$n (merged in #$pr)"
            fi
          done

  submit:
    name: Open the pull request
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'addition')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the submission branch
      pull-requests: write # open it and switch on auto-merge
      issues: write # comment on the issue
      actions: write # dispatch lint.yml and submission-check.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: submission/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Build the row from the form
        id: row
        run: python scripts/issue_to_pr.py

      - name: Explain why it was not added
        if: steps.row.outputs.status != 'ok'
        run: gh issue comment "$ISSUE" --body-file issue-comment.md

      - name: Push the submission branch
        if: steps.row.outputs.status == 'ok'
        env:
          NAME: ${{ steps.row.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add README.md
          git commit -m "Add $NAME" -m "Submitted in #$ISSUE."
          # the branch belongs to this workflow; an edited issue replaces its commit
          git push --force origin "$BRANCH"

      - name: Open the pull request and start its checks
        if: steps.row.outputs.status == 'ok'
        env:
          NAME: ${{ steps.row.outputs.name }}
          SECTION: ${{ steps.row.outputs.section }}
          AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Same decision auto-merge.yml makes: anything but a clean 0, a crash
          # included, waits for a maintainer. `main` is still the checkout's base.
          if python scripts/check_submission.py --base-ref main --review > /dev/null; then
            review=""
            merges="It merges itself once the required checks pass"
          else
            review="yes"
            merges="A maintainer reviews this kind of entry before it merges"
          fi
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            printf 'Adds **%s** to %s, from the form in #%s by @%s.\n\nCloses #%s\n\nOpened by the issue-to-pr workflow. %s.\n' \
              "$NAME" "$SECTION" "$ISSUE" "$AUTHOR" "$ISSUE" "$merges" > pr-body.md
            gh pr create --base main --head "$BRANCH" --title "Add $NAME" --body-file pr-body.md
            pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
            gh issue comment "$ISSUE" --body "Thanks! Opened #$pr with this entry. $merges, and it shows up on https://sagargupta.online/awesome-mcp-servers/ within the hour of merging."
          fi
          gh workflow run lint.yml --ref "$BRANCH"
          gh workflow run submission-check.yml --ref "$BRANCH"
          if [ -n "$review" ]; then
            gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=needs-review" > /dev/null
          else
            gh pr merge "$pr" --auto --squash
          fi
