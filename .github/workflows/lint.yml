name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Read from .python-version so a local run and CI cannot drift onto
      # different interpreters with nothing reconciling them.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # On a pull request, fail only on problems the pull request introduces.
      # A bad row merged to main used to break validation for every contributor
      # who came after it, which is how #88 went red for #87's mistake.
      # Pre-existing problems are still listed, just not blamed on the author.
      - name: Validate README structure
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python scripts/validate.py --baseline "origin/${{ github.base_ref }}"

      # Everywhere else, hold the whole file to the bar so pre-existing breakage
      # stays visible on main rather than becoming permanently tolerated.
      - name: Validate README structure (full)
        if: github.event_name != 'pull_request'
        run: python scripts/validate.py

  python-checks:
    name: Lint and test the gate scripts
    runs-on: ubuntu-latest
    # The submission gate is Python now, so it needs a gate of its own: a
    # regression in validate.py or check_submission.py silently weakens every
    # pull-request check while the list itself stays green.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # Hash-locked rather than resolved at install time: a ruff release must not
      # flip `ruff format --check` on an unrelated pull request, and nothing should
      # enter this job without a checksum. Regenerate with the command in
      # requirements-dev.in.
      - name: Install tooling
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check scripts/ tests/

      - name: Check formatting
        run: ruff format --check scripts/ tests/

      - name: Test
        run: pytest tests/ -q

  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A dead link is a defect, so this job fails on one. lychee.toml holds the
      # retry and rate-limit settings that keep that from being flaky.
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
