name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read from .python-version so a local run and CI cannot drift onto
      # different interpreters with nothing reconciling them.
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Validate README structure
        run: python scripts/validate.py

  python-checks:
    name: Lint and test the gate scripts
    runs-on: ubuntu-latest
    # The submission gate is Python now, so it needs a gate of its own: a
    # regression in validate.py or check_submission.py silently weakens every
    # pull-request check while the list itself stays green.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install tooling
        run: python -m pip install --upgrade ruff pytest

      - name: Lint
        run: ruff check scripts/ tests/

      - name: Check formatting
        run: ruff format --check scripts/ tests/

      - name: Test
        run: pytest tests/ -q

  link-check:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A dead link is a defect, so this job fails on one. lychee.toml holds the
      # retry and rate-limit settings that keep that from being flaky.
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
