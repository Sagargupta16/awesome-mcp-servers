name: Website

# Builds the searchable site from README.md (scripts/build_site.py) and deploys it
# to GitHub Pages.
#
# Why more than push. Auto-merge lands community pull requests with GITHUB_TOKEN,
# and GitHub does not start a workflow run from a GITHUB_TOKEN push, so an
# auto-merged entry never triggers the push event below. The workflow_run trigger
# rebuilds within a minute or so of the run that merged it; the schedule is a
# fallback that also refreshes the stars and last-push dates.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - site/**
      - scripts/build_site.py
      - scripts/validate.py
      - .github/workflows/pages.yml
  # An auto-merge made with GITHUB_TOKEN starts no workflow, so the merge itself
  # cannot trigger this. The runs that come just before a merge can: the last
  # required check finishing, or Auto merge / Star check merging in the run. The
  # schedule stays as a fallback; GitHub ran the "hourly" one every 3 to 6 hours.
  workflow_run:
    workflows: [Lint, Submission check, Auto merge, Star check]
    types: [completed]
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a run already deploying finishes rather than being cut off
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Those runs finish several times per pull request, mostly before anything
  # merges, so a run they trigger only builds when main moved since the last
  # deploy. Every other trigger always builds.
  changed:
    name: Decide whether main moved
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # a merge started by the run that just finished can take a few seconds
          sleep 30
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          # the commit the site was last published from
          last=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].sha')
          if [ "$head" = "$last" ]; then
            echo "main is still $head, already deployed"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build site
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Build from README.md
        env:
          # read-only use: stars and last-push dates for the listed repositories
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
